<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정재웅 - Web Services</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
</head>
<body>
    <header class="header">
        <div class="container">
            <!-- 대문자(J, W)에 포인트 컬러(point-color) 적용 (텍스트는 projects.json meta에서 주입) -->
            <h1 class="logo" id="home-btn"><span class="point-color">J</span>ae<span class="point-color">W</span>oong</h1>
        </div>
    </header>

    <main class="container">
        <!-- 리스트 뷰 -->
        <section id="list-view" class="view-section active">
            <div class="section-header">
                <h2 id="list-title">Projects</h2>
                <p id="list-subtitle">일상의 불편을 직접 기획하고 서비스로 만들어온 기록입니다.</p>
            </div>
            <div class="project-grid" id="project-grid">
                <!-- JS에서 렌더링 -->
            </div>
        </section>

        <!-- 상세 뷰 -->
        <section id="detail-view" class="view-section">
            <button class="back-btn" id="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Projects
            </button>
            <div class="detail-container" id="detail-content">
                <!-- JS에서 렌더링 -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
